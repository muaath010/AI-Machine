<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محطة التقييم التفاعلية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            text-align: center;
            padding: 50px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: auto;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        button:hover { background-color: #45a049; }
        #webcam-container { margin: 20px 0; }
        #webcam-container canvas { border-radius: 10px; border: 3px solid #ddd; }
        #label-container {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f5e9;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>المنصة الذكية للتقييم</h1>
    <p>ضع العينة أو المجسم أمام الكاميرا للتعرف عليه تلقائياً</p>
    
    <button type="button" onclick="init()">تشغيل الكاميرا والبدء</button>
    
    <div id="webcam-container"></div>
    <div id="label-container"></div>
</div>

<!-- استدعاء مكتبات الذكاء الاصطناعي من جوجل -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script>
    // تم إضافة الرابط الخاص بك هنا مع التأكد من وجود الشرطة المائلة في النهاية
    const URL = "https://teachablemachine.withgoogle.com/models/[...]/";

    let model, webcam, labelContainer, maxPredictions;

    async function init() {
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        // تحميل النموذج
        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        // إعداد الكاميرا
        const flip = true; 
        webcam = new tmImage.Webcam(400, 400, flip); 
        await webcam.setup(); 
        await webcam.play();
        window.requestAnimationFrame(loop);

        // إضافة الكاميرا للصفحة
        document.getElementById("webcam-container").appendChild(webcam.canvas);
        
        labelContainer = document.getElementById("label-container");
        labelContainer.style.display = "block";
    }

    async function loop() {
        webcam.update();
        await predict();
        window.requestAnimationFrame(loop);
    }

    async function predict() {
        const prediction = await model.predictTopK(webcam.canvas, 1);
        
        // عرض النتيجة الأعلى دقة فقط
        const className = prediction[0].className;
        const probability = (prediction[0].probability * 100).toFixed(0);
        
        if(probability > 85) {
            labelContainer.innerHTML = "تم التعرف على: <span style='color:#4CAF50'>" + className + "</span> بنسبة دقة " + probability + "%";
            // هنا لاحقاً سنضيف كود إرسال البيانات إلى Google Sheets
        } else {
            labelContainer.innerHTML = "جاري التعرف... يرجى توضيح العينة";
        }
    }
</script>

</body>
</html>
