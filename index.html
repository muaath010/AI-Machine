<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموسوعة الذكية التفاعلية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* إعدادات الصفحة والخلفية */
        body {
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #00d2ff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow-y: auto;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* الحاوية الزجاجية */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 700px; /* تم توسيعها قليلاً لتناسب النصوص الطويلة */
            width: 100%;
            z-index: 10;
        }

        h1 {
            font-weight: 900;
            margin-bottom: 5px;
            font-size: 2rem;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
        }

        p.subtitle {
            color: #b0c4de;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .cyber-btn {
            background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%);
            color: #fff;
            border: none;
            padding: 12px 35px;
            font-size: 1.1rem;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
            min-width: 220px;
            min-height: 50px;
        }

        .cyber-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.8);
        }

        #camera-instruction {
            display: none;
            color: #00ff88;
            font-size: 1.2rem;
            font-weight: 700;
            margin: 15px 0;
            animation: pulse-text 2s infinite;
        }

        @keyframes pulse-text {
            0% { opacity: 0.7; }
            50% { opacity: 1; text-shadow: 0 0 10px rgba(0, 255, 136, 0.8); }
            100% { opacity: 0.7; }
        }

        #webcam-container {
            margin: 10px auto;
        }

        #webcam-container canvas {
            border-radius: 15px;
            border: 3px solid #00d2ff;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
            transform: scaleX(-1);
            max-width: 100%;
            height: auto;
        }

        /* تنسيق مربع المعلومات الذي سيظهر */
        #info-card {
            margin-top: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
            border-right: 5px solid #00ff88; /* خط جانبي أنيق */
            border-radius: 10px;
            box-shadow: inset 0 0 15px rgba(0, 255, 136, 0.1);
            display: none;
            text-align: right; /* محاذاة النص لليمين ليناسب العربية */
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .object-title {
            color: #00ff88;
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 5px;
        }

        .object-details {
            color: #e0e0e0;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        /* دوائر التحميل */
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            animation: spin 1s linear infinite;
            display: none;
            margin: auto;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        #loading-text {
            color: #00d2ff;
            font-size: 1rem;
            margin-top: 15px;
            display: none;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse { 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>

<div class="glass-panel">
    <h1>الموسوعة الذكية</h1>
    <p class="subtitle" id="intro-text">نظام التعرف الآلي وتقديم المعلومات للطلاب</p>
    
    <button id="start-btn" class="cyber-btn" onclick="init()">
        <span id="btn-text">تشغيل الماسح الضوئي</span>
        <div id="loader" class="loader"></div>
    </button>
    
    <div id="loading-text">جاري تهيئة العقل الإلكتروني... يرجى الانتظار</div>
    <div id="camera-instruction">وجه الكاميرا نحو القطعة أو المجسم</div>
    <div id="webcam-container"></div>
    
    <!-- بطاقة المعلومات التي ستعرض النتيجة -->
    <div id="info-card">
        <div class="object-title" id="obj-title">اسم القطعة</div>
        <div class="object-details" id="obj-details">جاري تحميل المعلومات...</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script>
    // ⚠️ ضع الرابط الخاص بك هنا
    const URL = "https://teachablemachine.withgoogle.com/models/ptSLJmKdP/";

    /* 
    =========================================
    🧠 قاعدة المعرفة (The Knowledge Base)
    =========================================
    هنا تضع اسم الفئة (كما كتبتها في Teachable Machine بالضبط) 
    وأمامها المعلومات التي تريد أن يقرأها النظام للطلاب.
    */
    const knowledgeBase = {
        "RAM": "هذه القطعة تسمى ذاكرة الوصول العشوائي أو الرام. هي الذاكرة المؤقتة للحاسوب، حيث تحتفظ بالبيانات أثناء عمل الجهاز فقط، وتفقدها بمجرد انقطاع التيار الكهربائي. كلما زاد حجمها، زادت سرعة الجهاز في تشغيل البرامج.",
        
        "HDD": "هذا هو القرص الصلب الميكانيكي. وظيفته تخزين جميع ملفاتك، وصورك، ونظام التشغيل بشكل دائم. حتى لو قمت بإيقاف تشغيل الحاسوب، ستبقى بياناتك محفوظة بداخله بأمان.",
        
        "CPU": "هذا هو المعالج الدقيق أو وحدة المعالجة المركزية. هل تعلم أنه بمثابة العقل المدبر للحاسوب؟ فهو الذي يقوم بتنفيذ جميع العمليات الحسابية والمنطقية، وبدونه لا يمكن للحاسوب أن يعمل.",
        
        "Motherboard": "هذه هي اللوحة الأم. سُميت بهذا الاسم لأنها تحتضن وتربط جميع قطع الحاسوب ببعضها البعض، مثل المعالج والذاكرة والقرص الصلب، وتسمح بتبادل البيانات بينها."
    };

    let model, webcam, maxPredictions;
    let isPlaying = false;
    let lastSpokenClass = ""; 

    async function init() {
        if (isPlaying) return;

        document.getElementById("btn-text").style.display = "none";
        document.getElementById("loader").style.display = "block";
        document.getElementById("loading-text").style.display = "block";
        document.getElementById("start-btn").style.cursor = "wait";

        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        try {
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            const flip = true; 
            webcam = new tmImage.Webcam(300, 300, flip); 
            await webcam.setup(); 
            await webcam.play();
            window.requestAnimationFrame(loop);

            document.getElementById("start-btn").style.display = "none";
            document.getElementById("loading-text").style.display = "none";
            document.getElementById("intro-text").style.display = "none";
            document.getElementById("camera-instruction").style.display = "block"; 
            
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            isPlaying = true;

        } catch (error) {
            console.error(error);
            document.getElementById("loading-text").innerHTML = "❌ حدث خطأ! تأكد من إذن الكاميرا ورابط النموذج.";
        }
    }

    async function loop() {
        webcam.update();
        await predict();
        window.requestAnimationFrame(loop);
    }

    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // إيقاف أي صوت سابق لتجنب التداخل
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA'; 
            utterance.rate = 0.9; // أبطأ قليلاً ليكون الشرح مفهوماً للطلاب
            window.speechSynthesis.speak(utterance);
        }
    }

    async function predict() {
        const prediction = await model.predictTopK(webcam.canvas, 1);
        
        const className = prediction[0].className;
        const probability = (prediction[0].probability * 100).toFixed(0);
        
        const infoCard = document.getElementById("info-card");
        const titleEl = document.getElementById("obj-title");
        const detailsEl = document.getElementById("obj-details");
        
        if(probability > 85) {
            if (className !== lastSpokenClass) {
                
                // جلب المعلومات من قاعدة المعرفة، أو وضع نص افتراضي إذا لم تكن موجودة
                const informationText = knowledgeBase[className] || "تم التعرف على هذه القطعة، ولكن لا توجد تفاصيل إضافية مسجلة عنها في قاعدة البيانات حالياً.";
                
                // عرض النتيجة والمعلومات على الشاشة
                infoCard.style.display = "block";
                titleEl.innerText = className;
                detailsEl.innerText = informationText;
                
                // نطق المعلومات
                speak(informationText);
                
                lastSpokenClass = className; 
            }
        } else {
            // إذا لم يكن متأكداً من القطعة، يخفي بطاقة المعلومات
            infoCard.style.display = "none";
            lastSpokenClass = ""; 
        }
    }
</script>

</body>
</html>
