<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنصة الذكية للتقييم - الإصدار المستقبلي الناطق</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #00d2ff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow-y: auto;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 650px;
            width: 100%;
            z-index: 10;
        }

        h1 {
            font-weight: 900;
            margin-bottom: 5px;
            font-size: 1.8rem;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        #intro-text {
            color: #b0c4de;
            margin-bottom: 20px;
            font-size: 1rem;
        }

        .cyber-btn {
            background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%);
            color: #fff;
            border: none;
            padding: 12px 35px;
            font-size: 1.1rem;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 220px;
            min-height: 50px;
        }

        .cyber-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.8);
        }

        #camera-instruction {
            display: none;
            color: #00ff88;
            font-size: 1.2rem;
            font-weight: 700;
            margin: 15px 0 5px 0;
            animation: pulse-text 2s infinite;
        }

        @keyframes pulse-text {
            0% { opacity: 0.7; }
            50% { opacity: 1; text-shadow: 0 0 10px rgba(0, 255, 136, 0.8); }
            100% { opacity: 0.7; }
        }

        #webcam-container {
            margin: 5px auto 15px auto;
            position: relative;
            display: inline-block;
            max-width: 100%;
        }

        #webcam-container canvas {
            border-radius: 15px;
            border: 2px solid #00d2ff;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
            transform: scaleX(-1);
            max-width: 100%;
            height: auto;
        }

        #label-container {
            font-size: 1.3rem;
            font-weight: 700;
            margin-top: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #00d2ff;
            border-radius: 10px;
            box-shadow: inset 0 0 10px rgba(0, 210, 255, 0.2);
            display: none;
            word-wrap: break-word;
        }

        .highlight {
            color: #00ff88;
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.6);
        }

        .loader {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            animation: spin 1s linear infinite;
            display: none;
            position: absolute;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loading-text {
            color: #00d2ff;
            font-size: 1rem;
            margin-top: 15px;
            display: none;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

<div class="glass-panel">
    <h1>الذكاء الاصطناعي التعليمي</h1>
    <p id="intro-text">قم بتهيئة النظام لتشغيل الماسح الضوئي والصوتي</p>
    
    <button id="start-btn" class="cyber-btn" onclick="init()">
        <span id="btn-text">تشغيل النظام</span>
        <div id="loader" class="loader"></div>
    </button>
    
    <div id="loading-text">جاري تهيئة الشبكات العصبية وتشغيل الكاميرا... يرجى الانتظار</div>
    
    <div id="camera-instruction">⬇️ ضع العينة أمام الكاميرا للتعرف عليها ⬇️</div>
    
    <div id="webcam-container"></div>
    <div id="label-container"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script>
    const URL = "https://teachablemachine.withgoogle.com/models/OntxsklM4/";

    let model, webcam, labelContainer, maxPredictions;
    let isPlaying = false;
    
    // متغير جديد لمنع تكرار النطق الصوتي لنفس العينة
    let lastSpokenClass = ""; 

    async function init() {
        if (isPlaying) return;

        const btn = document.getElementById("start-btn");
        const btnText = document.getElementById("btn-text");
        const loader = document.getElementById("loader");
        const loadingText = document.getElementById("loading-text");
        const introText = document.getElementById("intro-text");
        const cameraInstruction = document.getElementById("camera-instruction");

        btnText.style.display = "none";
        loader.style.display = "block";
        loadingText.style.display = "block";
        btn.style.cursor = "wait";

        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        try {
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            const flip = true; 
            webcam = new tmImage.Webcam(300, 300, flip); 
            await webcam.setup(); 
            await webcam.play();
            window.requestAnimationFrame(loop);

            btn.style.display = "none";
            loadingText.style.display = "none";
            introText.style.display = "none";
            cameraInstruction.style.display = "block"; 
            
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            
            labelContainer = document.getElementById("label-container");
            labelContainer.style.display = "block";
            isPlaying = true;

        } catch (error) {
            console.error(error);
            loadingText.innerHTML = "❌ حدث خطأ! يرجى التأكد من السماح للمتصفح باستخدام الكاميرا.";
            loadingText.style.color = "#ff4d4d";
            loader.style.display = "none";
            btnText.style.display = "block";
            btn.style.cursor = "pointer";
        }
    }

    async function loop() {
        webcam.update();
        await predict();
        window.requestAnimationFrame(loop);
    }

    // دالة النطق الصوتي الجديدة
    function speak(text) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA'; // نطق باللغة العربية
            utterance.rate = 1; // سرعة النطق
            utterance.pitch = 1; // حدة الصوت
            window.speechSynthesis.speak(utterance);
        }
    }

    async function predict() {
        const prediction = await model.predictTopK(webcam.canvas, 1);
        
        const className = prediction[0].className;
        const probability = (prediction[0].probability * 100).toFixed(0);
        
        if(probability > 85) {
            labelContainer.innerHTML = `النتيجة: <span class="highlight">${className}</span> (دقة: ${probability}%)`;
            
            // التحقق مما إذا كانت هذه العينة جديدة ولم يتم نطقها للتو
            if (className !== lastSpokenClass) {
                speak("تم التعرف على " + className);
                lastSpokenClass = className; // حفظ العينة في الذاكرة لتجنب التكرار
            }
            
        } else {
            labelContainer.innerHTML = "جاري الفحص... يرجى توضيح العينة";
            lastSpokenClass = ""; // إعادة ضبط الذاكرة إذا لم يتعرف على شيء ليتحدث مرة أخرى لاحقاً
        }
    }
</script>

</body>
</html>
